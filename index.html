<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- daisyUI theme -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- style file -->
    <link rel="stylesheet" href="./assets/css/index.css" />

    <!-- fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- nav -->
    <div class="navbar bg-base-100 shadow-sm">
      <div class="flex">
        <a class="btn btn-ghost text-xl"
          ><img
            src="./assets/img/logo.png"
            alt="logo"
            class="w-full h-full object-cover"
        /></a>
      </div>
      <div class="flex justify-center gap-10 lg:flex">
        <ul class="menu menu-horizontal px-1">
          <li>
            <details>
              <summary>Movies</summary>
              <ul class="bg-base-100 rounded-t-none p-2 w-40">
                <li><a>Popular</a></li>
                <li><a>Now playing</a></li>
                <li><a>Upcomming</a></li>
                <li><a>Top Rated</a></li>
              </ul>
            </details>
          </li>
          <li>
            <details>
              <summary>TV Shows</summary>
              <ul class="bg-base-100 rounded-t-none p-2 w-40">
                <li><a>Popular</a></li>
                <li><a>Airing Today</a></li>
                <li><a>On TV</a></li>
                <li><a>Top Rated</a></li>
              </ul>
            </details>
          </li>
          <li>
            <details>
              <summary>People</summary>
              <ul class="bg-base-100 rounded-t-none p-2 w-40">
                <li><a>Popular</a></li>
              </ul>
            </details>
          </li>
          <li>
            <details>
              <summary>More</summary>
              <ul class="bg-base-100 rounded-t-none p-2 w-40">
                <li><a>Discussions</a></li>
                <li><a>Leaderboard</a></li>
                <li><a>Support</a></li>
                <li><a>API</a></li>
              </ul>
            </details>
          </li>
        </ul>
      </div>

      <div class="flex-1 gap-3 justify-end flex">
        <input
          type="text"
          id="search"
          placeholder="Search"
          class="input input-bordered md:w-auto min-w-150"
        />
        <div class="dropdown dropdown-end">
          <div
            tabindex="0"
            role="button"
            class="btn btn-ghost btn-circle avatar"
          >
            <div class="w-10 rounded-full">
              <img
                alt="Tailwind CSS Navbar component"
                src="./assets/img/download (2).jpeg"
              />
            </div>
          </div>
          <ul
            tabindex="-1"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
          >
            <li>
              <a class="justify-between">
                Profile
                <span class="badge">New</span>
              </a>
            </li>
            <li><a>Settings</a></li>
            <li><a>Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>

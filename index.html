<!DOCTYPE html>
<html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- navigation -->
    <nav class="flex items-center gap-10 p-4">
      <div class="logo w-30"><img src="./assets/img/logo.png" alt="" /></div>
      <ul class="flex space-x-4 p-4">
        <li>
          <a
            href="#"

        </li>
        <li>
          <a

        <li>

      <div class="flex flex-col text-right absolute top-38 right-20 text-white">
        <h1 class="text-6xl font-bold mb-4">Welcome</h1>
